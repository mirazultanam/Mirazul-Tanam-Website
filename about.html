<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="About Mirazul Tanam, architecture student, Designer and Artist based in Bangladesh."
    />
    <title>About — Mirazul Tanam</title>
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link

      href="assets/headline-semibold.woff2"
      as="font"
      type="font/woff2"

    <link rel="stylesheet" href="styles.css" />

  <body>
    <script>
      // Set the theme before first paint; shared.js validates and syncs buttons.
      try {
        document.body.dataset.theme =
          localStorage.getItem("portfolio-theme") || "default";
      } catch {}
    </script>
    <header>
      <a class="brand" href="#" aria-label="Home"></a
      ><a
        href="index.html"
        class="round about-button"
        aria-label="Return to home"
        title="Return to home"
        ><span class="ext" aria-hidden="true"></span
      ></a>

    <main class="about-page">
      <h1>ABOUT</h1>
      <section class="experience" aria-labelledby="experience-title">
        <h2 id="experience-title">EXPERIENCE</h2>
        <ul></ul>
      </section>
      <div class="disciplines"></div>
      <a class="back-work" href="index.html#work">Explore my work</a>
    </main>
    <footer id="contact">
      <span class="small"></span>
      <div class="contact-title-wrap"><h2></h2></div>
      <p></p>
      <nav class="contact-links" aria-label="Contact links"></nav>
      <div class="bottom">
        <span class="copyright"></span>
        <span class="note"></span>
        <a href="#">Back to the top ↑</a>
      </div>
    </footer>
    <div class="palette" aria-label="Choose a color theme">
      <span aria-hidden="true">Feeling colorful?</span>
    </div>
    <script src="data/site.js"></script>
    <script src="data/about.js"></script>
    <script src="js/content.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/reading-motion.js"></script>
    <script src="js/contact-motion.js"></script>
  </body>
</html>
