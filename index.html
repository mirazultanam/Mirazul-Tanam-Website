<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f4f2e9" />
    <meta
      name="description"
      content="Mirazul Tanam — architecture student, visual designer, and creative producer based in Bangladesh."
    />
    <title>Mirazul Tanam — Selected Work</title>
    <link rel="icon" href="favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link
      rel="preload"
      href="assets/headline-semibold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script>
      // Set the theme before first paint; shared.js validates and syncs buttons.
      try {
        document.body.dataset.theme =
          localStorage.getItem("portfolio-theme") || "default";
      } catch {}
    </script>
    <header>
      <a class="brand" href="#" aria-label="Home"></a
      ><a
        href="about.html"
        class="round about-button"
        aria-label="About me"
        title="About me"
        ><img
          src="assets/profile.webp"
          alt=""
          width="41"
          height="41"
          decoding="async"
      ></a>
    </header>
    <main>
      <section class="hero">
        <h1></h1>
        <div class="stickers"></div>
        <p class="intro"></p>
      </section>
      <section
        class="featured"
        aria-label="Featured work carousel"
        aria-roledescription="carousel"
      >
        <h2>Featured work</h2>
        <div class="carousel-stage" id="carousel-stage"></div>
        <span id="carousel-status" aria-live="polite" aria-atomic="true"></span>
      </section>
      <section id="work" class="work">
        <div class="section-head">
          <h2>All Works</h2>
        </div>
        <div class="filters" aria-label="Filter projects"></div>
        <div class="grid" id="projects"></div>
      </section>
      <section class="about-teaser">
        <a href="about.html"
          >Different mediums.<br />Same curiosity.
<small>Get to know me</small></a
        >
      </section>
    </main>
    <footer id="contact">
      <span class="small"></span>
      <div class="contact-title-wrap"><h2></h2></div>
      <p></p>
      <nav class="contact-links" aria-label="Contact links"></nav>
      <div class="bottom">
        <span class="copyright"></span>
        <span class="note"></span>
        <a href="about.html">More about me</a>
      </div>
    </footer>
    <div class="palette" aria-label="Choose a color theme">
      <span aria-hidden="true">Feeling colorful?</span>
    </div>
    <dialog id="project-modal" aria-labelledby="modal-title">
      <button class="modal-close" aria-label="Close gallery" autofocus>
        ×
      </button>
      <div class="project-page">
        <div class="project-heading">
          <span class="tag" id="modal-category"></span>
          <h2 id="modal-title"></h2>
        </div>
        <div class="modal-gallery" id="modal-gallery"></div>
        <div class="gallery-end">
          <button class="modal-back">← Back to All Works</button>
        </div>
      </div>
    </dialog>
    <script src="data/site.js"></script>
    <script src="data/projects.js"></script>
    <script src="js/content.js"></script>
    <script src="js/shared.js"></script>
    <script src="js/app.js"></script>
    <script src="js/contact-motion.js"></script>
  </body>
</html>
