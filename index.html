<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f4f2e9" />
    <meta
      name="description"
      content="Mirazul Tanam — architecture student, visual designer, and creative producer based in Bangladesh."
    />
    <title>Mirazul Tanam — Selected Work</title>
    <link
      rel="preload"
      href="assets/headline-semibold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <script>
      // Set the theme before first paint; shared.js validates and syncs buttons.
      try {
        document.body.dataset.theme =
          localStorage.getItem("portfolio-theme") || "default";
      } catch {}
    </script>
    <header>
      <a class="brand" href="#" aria-label="Home">MT.</a
      ><a
        href="about.html"
        class="round about-button"
        aria-label="About me"
        title="About me"
        ><img
          src="assets/profile.webp"
          alt=""
          width="41"
          height="41"
          decoding="async"
      ></a>
    </header>
    <main>
      <section class="hero">
        <h1>MIRAZUL<span>TANAM</span></h1>
        <div class="stickers">
          <a
            class="sticker"
            style="--r: -13deg"
            href="#work"
            aria-label="Explore architecture"
            ><img
              src="assets/sticker-sm-barrack.webp"
              alt="Architectural illustration of a barrack" /></a
          ><a
            class="sticker"
            style="--r: 8deg"
            href="#work"
            aria-label="Explore design"
            ><img src="assets/sticker-illustration.webp" alt="Illustrated samurai character" /></a
          ><a
            class="sticker"
            style="--r: -6deg"
            href="#work"
            aria-label="Explore film"
            ><img src="assets/sticker-independence-day.webp" alt="Independence day poster design"
          /></a>
        </div>
        <p class="intro">Design, Illustration, Architecture and Art</p>
      </section>
      <section
        class="featured"
        aria-label="Featured work carousel"
        aria-roledescription="carousel"
      >
        <h2>Featured work</h2>
        <div class="carousel-stage" id="carousel-stage"></div>
        <span id="carousel-status" aria-live="polite" aria-atomic="true"></span>
      </section>
      <section id="work" class="work">
        <div class="section-head">
          <h2>All Works</h2>
        </div>
        <div class="filters" aria-label="Filter projects">
          <button aria-pressed="false" data-filter="Concept Arts">
            Concept Arts</button
          ><button aria-pressed="false" data-filter="Illustration">
            Illustration</button
          ><button aria-pressed="false" data-filter="Graphic Design">
            Graphic Design</button
          ><button aria-pressed="false" data-filter="Caricatures and Portraits">
            Caricatures and Portraits</button
          ><button aria-pressed="false" data-filter="Cartoon">Cartoon</button
          ><button aria-pressed="false" data-filter="Architectural Illustration">
            Architectural Illustration</button
          ><button aria-pressed="false" data-filter="Animation">
            Animation
          </button>
        </div>
        <div class="grid" id="projects"></div>
      </section>
      <section class="about-teaser">
        <a href="about.html"
          >Different mediums.<br />Same curiosity.
<small>Get to know me</small></a
        >
      </section>
    </main>
    <footer id="contact">
      <span class="small">GOOD THINGS START WITH A CONVERSATION.</span>
      <div class="contact-title-wrap"><h2>CONTACT</h2></div>
      <p>Reach me here:</p>
      <nav class="contact-links" aria-label="Contact links">
        <a href="mailto:mirazultanam@gmail.com">Gmail</a
        ><a
          href="https://www.instagram.com/_luzarim"
          target="_blank"
          rel="noopener"
          >Instagram</a
        ><a
          href="https://www.linkedin.com/in/mirazul-tanam-391a46216"
          target="_blank"
          rel="noopener"
          >LinkedIn</a
        >
      </nav>
      <div class="bottom">
        <span>© <span id="year"></span> Mirazul Tanam</span>
        <span>Made with curiosity.</span>
        <a href="about.html">More about me</a>
      </div>
    </footer>
    <div class="palette" aria-label="Choose a color theme">
      <span aria-hidden="true">Feeling colorful?</span
      ><button
        data-theme="default"
        style="--swatch: #f4f2e9"
        aria-label="Cream theme"
        aria-pressed="true"
      ></button
      ><button
        data-theme="purple"
        style="--swatch: #c3b4ef"
        aria-label="Lavender theme"
        aria-pressed="false"
      ></button
      ><button
        data-theme="green"
        style="--swatch: #d9f777"
        aria-label="Lime theme"
        aria-pressed="false"
      ></button
      ><button
        data-theme="dark"
        style="--swatch: #252c29"
        aria-label="Dark theme"
        aria-pressed="false"
      ></button>
    </div>
    <dialog id="project-modal" aria-labelledby="modal-title">
      <button class="modal-close" aria-label="Close gallery" autofocus>
        ×
      </button>
      <div class="project-page">
        <div class="project-heading">
          <span class="tag" id="modal-category"></span>
          <h2 id="modal-title"></h2>
        </div>
        <div class="modal-gallery" id="modal-gallery"></div>
        <div class="gallery-end">
          <button class="modal-back">← Back to All Works</button>
        </div>
      </div>
    </dialog>
    <script src="projects.js"></script>
    <script src="shared.js"></script>
    <script src="app.js"></script>
    <script src="contact-motion.js"></script>
  </body>
</html>
